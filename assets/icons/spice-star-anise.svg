    <path d="M15 0 C25 -8 45 -10 52 0 C45 10 25 8 15 0 Z" fill="#5D4037" stroke="#000" stroke-width="3"/>
    <circle cx="35" cy="0" r="4" fill="#FFA726" stroke="#000" stroke-width="1.5"/>

    <!-- Point 4 -->
    <path d="M11 11 C18 22 32 38 25 45 C16 40 7 28 11 11 Z" fill="#6D4C41" stroke="#000" stroke-width="3"/>
