    <path d="M-15 0 C-25 -8 -45 -10 -52 0 C-45 10 -25 8 -15 0 Z" fill="#6D4C41" stroke="#000" stroke-width="3"/>
    <circle cx="-35" cy="0" r="4" fill="#FFA726" stroke="#000" stroke-width="1.5"/>

    <!-- Point 8 -->
    <path d="M-11 -11 C-18 -22 -32 -38 -25 -45 C-16 -40 -7 -28 -11 -11 Z" fill="#4E342E" stroke="#000" stroke-width="3"/>
