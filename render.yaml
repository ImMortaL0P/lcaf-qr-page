services:
  - type: web
    name: lcaf-qr-page
    env: static
    buildCommand: ""
    publishPath: "."
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /css/*
        name: Cache-Control
        value: public, max-age=604800, stale-while-revalidate=86400
      - path: /js/*
        name: Cache-Control
        value: public, max-age=604800, stale-while-revalidate=86400
